id = "gedu.issue-card"
name = "Issue card"
version = "0.1.0"
min_herdr_version = "0.9.5"
description = "A floating card for the GitHub issues an agent mentioned on screen."
platforms = ["macos", "linux"]

[[actions]]
id = "show"
title = "Show the issue card"
contexts = ["workspace"]
command = ["node", "src/show.js"]

[[panes]]
id = "card"
title = "Issue"
placement = "popup"
width = "70%"
height = 18
command = ["node", "src/popup.js"]

[[link_handlers]]
id = "github-issue"
title = "Show the issue card"
pattern = "^https://github\\.com/[^/]+/[^/]+/(issues|pull)/[0-9]+([/?#].*)?$"
action = "show"
